services:
  postgres:
    image: postgres:17-alpine
    container_name: accessforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accessforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accessforge}
      POSTGRES_DB: ${POSTGRES_DB:-accessforge}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - accessforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-accessforge} -d ${POSTGRES_DB:-accessforge}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: accessforge-redis
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - accessforge-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: accessforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - accessforge-minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      retries: 10

  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: accessforge-otel
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infrastructure/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4318:4318'

volumes:
  accessforge-postgres:
  accessforge-redis:
  accessforge-minio:
